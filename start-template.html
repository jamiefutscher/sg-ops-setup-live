<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirited Gifts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0d10;--panel:rgba(18,20,24,.72);--line:rgba(255,255,255,.08);--txt:#e8e6e1;--muted:#8d9299;--amber:#f2a93b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Montserrat","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--txt);background:var(--bg) url("file:///C:/SGSetup/wallpaper.jpg") center/cover no-repeat fixed;}
  body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(11,13,16,.35),rgba(11,13,16,.85));pointer-events:none}
  .wrap{position:relative;max-width:1180px;margin:0 auto;padding:56px 40px 40px}
  header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:36px}
  .brand,.clock .t,a.tile .n,.dash h2{font-family:"Jost","Montserrat","Segoe UI",sans-serif}
  .brand{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
  .brand b{color:var(--amber);font-weight:600}
  .clock{text-align:right}
  .clock .t{font-size:56px;font-weight:300;letter-spacing:-.02em;line-height:1}
  .clock .d{font-size:14px;color:var(--muted);margin-top:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  a.tile{display:flex;align-items:center;gap:14px;padding:18px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(14px);color:var(--txt);text-decoration:none;transition:transform .12s ease,border-color .12s ease,background .12s ease}
  a.tile:hover{transform:translateY(-2px);border-color:rgba(242,169,59,.6);background:rgba(28,30,36,.85)}
  a.tile img{width:28px;height:28px;border-radius:7px;background:#fff;padding:3px}
  a.tile .n{font-size:16px;font-weight:600}
  a.tile .u{font-size:11px;color:var(--muted);margin-top:2px}
  .dash{margin-top:34px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(14px);overflow:hidden}
  .dash h2{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);padding:14px 18px;border-bottom:1px solid var(--line)}
  .dash iframe{width:100%;height:520px;border:0;display:block;background:#0b0d10}
  .dash .soon{padding:38px 18px;color:var(--muted);font-size:15px}
  .dash .soon b{color:var(--txt)}
  footer{margin-top:28px;font-size:11px;color:var(--muted);letter-spacing:.08em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>Spirited Gifts</b> &nbsp;·&nbsp; Space Warehouse</div>
    <div class="clock"><div class="t" id="t">--:--</div><div class="d" id="d"></div></div>
  </header>
  <div class="grid">
<!--SITES-->
  </div>
  <section class="dash">
    <h2>Floor stats &amp; leaderboard</h2>
<!--DASHBOARD-->
  </section>
  <footer>PC: <!--PCNAME--> &nbsp;·&nbsp; Space Warehouse start page · edit sites.txt on the setup drive and re-run to change</footer>
</div>
<script>
  function tick(){var n=new Date();var h=n.getHours(),m=n.getMinutes();var ap=h>=12?'PM':'AM';h=h%12||12;
    document.getElementById('t').textContent=h+':'+(m<10?'0':'')+m+' '+ap;
    document.getElementById('d').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});}
  tick();setInterval(tick,15000);
</script>
</body>
</html>
